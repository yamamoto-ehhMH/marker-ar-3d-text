<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Hiro Marker AR</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      .a-enter-vr-button {
        display: none !important;
      }

      video,
      .arjs-video,
      #arjs-video,
      .a-canvas,
      a-scene {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
      }

      video,
      .arjs-video,
      #arjs-video {
        object-fit: cover !important;
        z-index: 0 !important;
      }

      .a-canvas,
      a-scene {
        background: transparent !important;
        z-index: 1 !important;
      }
    </style>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; precision: mediump"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono;"
    >
      <a-marker type="pattern" url="assets/patt.hiro" emitevents="true">
        <a-box position="0 0.25 0" depth="0.2" height="0.2" width="0.2" color="#00ffc3"></a-box>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
