<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Hiro Marker AR</title>
    <style>
      :root {
        --app-w: 100vw;
        --app-h: 100dvh;
      }

      html,
      body {
        margin: 0;
        width: var(--app-w);
        height: var(--app-h);
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      .a-enter-vr-button {
        display: none !important;
      }

      video,
      .arjs-video,
      #arjs-video,
      .a-canvas,
      a-scene,
      canvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: var(--app-w) !important;
        height: var(--app-h) !important;
        min-width: var(--app-w) !important;
        min-height: var(--app-h) !important;
      }

      video,
      .arjs-video,
      #arjs-video {
        object-fit: cover !important;
        object-position: center center !important;
        z-index: 0 !important;
      }

      .a-canvas,
      a-scene {
        background: transparent !important;
        z-index: 1 !important;
      }
    </style>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <script>
      AFRAME.registerComponent("fit-model", {
        schema: {
          targetSize: { type: "number", default: 0.8 },
          yOffset: { type: "number", default: 0.02 },
          rotX: { type: "number", default: 0 },
          rotY: { type: "number", default: 0 },
          rotZ: { type: "number", default: 0 }
        },
        init: function () {
          this.el.addEventListener("model-loaded", () => {
            const object3D = this.el.getObject3D("mesh");
            if (!object3D) {
              return;
            }

            object3D.rotation.set(
              THREE.MathUtils.degToRad(this.data.rotX),
              THREE.MathUtils.degToRad(this.data.rotY),
              THREE.MathUtils.degToRad(this.data.rotZ)
            );

            const box = new THREE.Box3().setFromObject(object3D);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxAxis = Math.max(size.x, size.y, size.z);
            if (!maxAxis || !isFinite(maxAxis)) {
              return;
            }

            const scale = this.data.targetSize / maxAxis;
            object3D.scale.set(scale, scale, scale);

            const fitted = new THREE.Box3().setFromObject(object3D);
            const center = new THREE.Vector3();
            fitted.getCenter(center);
            object3D.position.sub(center);

            const grounded = new THREE.Box3().setFromObject(object3D);
            object3D.position.y -= grounded.min.y;

            this.el.object3D.position.y = this.data.yOffset;
          });
        }
      });

      function forceArFullscreen() {
        const width = Math.max(window.innerWidth || 0, 1);
        const height = Math.max(window.innerHeight || 0, 1);
        document.documentElement.style.setProperty("--app-w", width + "px");
        document.documentElement.style.setProperty("--app-h", height + "px");

        const elements = document.querySelectorAll(
          "video, .arjs-video, #arjs-video, .a-canvas, a-scene, canvas"
        );
        elements.forEach((el) => {
          el.style.width = width + "px";
          el.style.height = height + "px";
          el.style.minWidth = width + "px";
          el.style.minHeight = height + "px";
          el.style.left = "0px";
          el.style.top = "0px";
        });
      }

      window.addEventListener("resize", forceArFullscreen, { passive: true });
      window.addEventListener("orientationchange", forceArFullscreen, { passive: true });
      document.addEventListener("DOMContentLoaded", () => {
        forceArFullscreen();
        setTimeout(forceArFullscreen, 150);
        setTimeout(forceArFullscreen, 500);
      });
    </script>
  </head>
  <body>
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; precision: mediump"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono;"
    >
      <a-assets timeout="20000">
        <a-asset-item id="candleModel" src="assets/GlassHurricaneCandleHolder.glb"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; intensity: 1.1; color: #ffffff"></a-entity>
      <a-entity light="type: directional; intensity: 0.9; color: #ffffff" position="1 2 1"></a-entity>

      <a-marker
        type="pattern"
        url="assets/patt.hiro"
        emitevents="true"
        smooth="true"
        smoothCount="15"
        smoothTolerance="0.01"
        smoothThreshold="5"
      >
        <a-entity
          gltf-model="#candleModel"
          fit-model="targetSize: 0.95; yOffset: 0.01; rotX: -90; rotY: 180"
          position="0 0.01 0"
          scale="1 1 1"
          rotation="0 0 0"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
