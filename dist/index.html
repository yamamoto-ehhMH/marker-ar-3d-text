<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Hiro Marker AR</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      .a-enter-vr-button {
        display: none !important;
      }

      video,
      .arjs-video,
      #arjs-video,
      .a-canvas,
      a-scene {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
      }

      video,
      .arjs-video,
      #arjs-video {
        object-fit: cover !important;
        z-index: 0 !important;
      }

      .a-canvas,
      a-scene {
        background: transparent !important;
        z-index: 1 !important;
      }
    </style>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <script>
      AFRAME.registerComponent("block-text", {
        schema: {
          value: { type: "string", default: "HELLO" },
          color: { type: "color", default: "#ffd76a" },
          depthLayers: { type: "int", default: 8 }
        },
        init: function () {
          const root = this.el;
          const value = this.data.value;
          const layerCount = Math.max(3, this.data.depthLayers);

          for (let i = 0; i < layerCount; i += 1) {
            const layer = document.createElement("a-entity");
            const isFront = i === layerCount - 1;
            const zOffset = -0.07 + i * 0.01;
            layer.setAttribute(
              "text",
              [
                "value: " + value,
                "align: center",
                "anchor: center",
                "baseline: center",
                "width: 2.25",
                "color: " + (isFront ? this.data.color : "#7a5b1e")
              ].join("; ")
            );
            layer.setAttribute("position", "0 0 " + zOffset.toFixed(3));
            root.appendChild(layer);
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; precision: mediump"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono;"
    >
      <a-marker type="pattern" url="assets/patt.hiro" emitevents="true">
        <a-plane
          position="0 0.001 0"
          rotation="-90 0 0"
          width="1.24"
          height="1.24"
          color="#000000"
          material="side: double; opacity: 1"
        ></a-plane>

        <a-box
          position="0 0.032 0"
          width="1.24"
          height="0.064"
          depth="1.24"
          color="#050505"
          material="metalness: 0.2; roughness: 0.8"
        ></a-box>

        <a-entity
          block-text="value: HELLO; color: #ffd76a; depthLayers: 9"
          position="0 0.09 0"
          scale="10 10 10"
          rotation="-90 180 0"
          animation="property: position; from: 0 0.09 0; to: 0 0.42 0; dur: 1200; easing: easeOutCubic; loop: false; startEvents: markerFound"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
